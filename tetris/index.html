<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#0f8f38"><title>Tetris — Juegos</title><link rel="stylesheet" href="../arcade-system.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="world.css"><link rel="stylesheet" href="../mobile-layout.css"><script src="../theme.js"></script></head>
<body data-game="tetris"><main class="game-shell arcade-shell"><a class="back" href="../">← Volver al arcade</a><section class="game-card" aria-label="Juego de Tetris"><header><img class="brand-logo brand-logo-small" src="../assets/rema-logo.png" alt="Rem Enterprises"><p class="eyebrow">FÁBRICA DE BLOQUES / 001</p><h1><span>TET</span>RIS</h1><p class="tagline">Apilá, limpiá líneas y mantené la producción en marcha.</p></header><div class="game-layout"><div class="board-column"><div class="board-wrap"><canvas id="board" width="300" height="600" tabindex="0" aria-label="Pozo industrial de Tetris"></canvas><div id="overlay" class="overlay arcade-result"><strong id="overlay-title">TETRIS</strong><span id="overlay-copy">Presioná jugar para comenzar</span><button id="start-button" type="button">Jugar</button></div></div><div class="mobile-controls arcade-controls" role="group" aria-label="Controles táctiles"><button data-action="left" aria-label="Mover izquierda">←</button><button data-action="rotate" aria-label="Girar">↻</button><button data-action="right" aria-label="Mover derecha">→</button><button data-action="down" aria-label="Bajar">↓</button><button data-action="drop" aria-label="Caída rápida">⇩</button></div></div><aside class="panel arcade-hud"><div class="stats"><div class="stat"><span>Puntaje</span><strong id="score">0</strong></div><div class="stat"><span>Líneas</span><strong id="lines">0</strong></div><div class="stat"><span>Nivel</span><strong id="level">1</strong></div></div><div class="next-piece"><span class="label">Siguiente lote</span><canvas id="next" width="120" height="120" aria-label="Próxima pieza"></canvas></div><p id="line-feedback" class="line-feedback" aria-live="polite">LÍNEA DE PRODUCCIÓN LISTA</p><button id="pause-button" class="secondary" type="button">Pausar</button><div class="instructions"><p><kbd>←</kbd><kbd>→</kbd> mover</p><p><kbd>↑</kbd> girar · <kbd>↓</kbd> bajar</p><p><kbd>Espacio</kbd> caída rápida</p></div></aside></div><footer>REM BLOCK WORKS <span>⌘</span> TURNO ACTIVO</footer><section id="records" class="records" aria-label="Tabla de récords"></section></section></main><script src="../supabase-config.js"></script><script src="game.js"></script><script src="../leaderboard.js"></script></body></html>
